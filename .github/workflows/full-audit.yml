name: Full Natively build audit

on:
  push:
    branches:
      - review/imported-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-and-electron-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without platform-specific native rebuilds
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build renderer and run its TypeScript check
        run: npm run build

      - name: Type-check active Electron source
        run: npm run typecheck:electron

      - name: Bundle Electron main, preload, and runtime modules
        run: npm run build:electron

      - name: Verify required runtime entry points
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist-electron/electron/main.js
          test -s dist-electron/electron/preload.js

      - name: Package changed source files
        shell: bash
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD -- 'src/**' 'electron/**' 'scripts/**' 'vite.config.*' 'tsconfig*.json' 'package.json' |
            while IFS= read -r file; do
              if [ -f "$file" ]; then printf '%s\n' "$file"; fi
            done > /tmp/changed-source-files.txt
          test -s /tmp/changed-source-files.txt
          zip -q natively-source-changes.zip -@ < /tmp/changed-source-files.txt

      - name: Upload changed-source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: natively-changed-source
          path: natively-source-changes.zip
          if-no-files-found: error
          retention-days: 14
