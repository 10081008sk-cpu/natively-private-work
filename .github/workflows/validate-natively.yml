name: Validate Natively source

on:
  push:
    branches:
      - review/imported-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without platform-specific postinstall scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check Electron main process
        run: npm run typecheck:electron
